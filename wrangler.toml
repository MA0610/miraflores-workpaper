# Cloudflare Pages (free plan): static app from dist/ + functions/api (Pages Functions) + a D1 database.
# Deploy steps are in README.md ("Deploy (free)"). database_id is filled in after `npm run cf:db:create`.
name = "okafor-lindqvist-workpaper"
pages_build_output_dir = "dist"
compatibility_date = "2025-06-01"

[[d1_databases]]
binding = "DB"
database_name = "workpaper-ledger"
database_id = "6ca9a19f-dd8b-4f46-b1d1-ef82016fb237"
migrations_dir = "migrations"
